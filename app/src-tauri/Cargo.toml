[package]
name = "hedy-app"
version = "0.1.0"
description = "Hedy desktop app"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hedy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
hedy-core = { version = "0.1.0", path = "../../crates/hedy-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.4"
whoami = "2.1.3"

[build-dependencies]
tauri-build = "2.7.4"
