[package]
name = "hedy-app"
version = "1.2.0"
description = "Hedy desktop app"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hedy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
hedy-core = { version = "1.2.0", path = "../../crates/hedy-core" }
hedy-memory = { version = "1.2.0", path = "../../crates/hedy-memory" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
whoami = "2.1.3"

[dev-dependencies]
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3.27.0"

[build-dependencies]
tauri-build = "2.7.4"
