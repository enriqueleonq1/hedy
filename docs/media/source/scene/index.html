<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hedy intro</title>
<link rel="stylesheet" href="scene.css">
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="terms"></div>
  <div id="limit">
    <div class="limit__head"><span class="limit__dot"></span><span>Claude · personal?</span><b id="limit-pct">62%</b></div>
    <div class="limit__track"><div class="limit__fill" id="limit-fill"></div></div>
    <div class="limit__note" id="limit-note">Weekly limit reached</div>
  </div>
  <div id="blob-wrap"></div>
  <div id="title">
    <div class="title__word">Hedy</div>
    <div class="title__sub">Named after Hedy Lamarr</div>
  </div>
  <div id="win">
    <div id="screens"></div>
    <div id="typing"><div id="typing-clip"></div><div id="typing-cover"></div><div id="caret"></div></div>
    <div id="marks"></div>
  </div>
  <div id="chips"></div>
  <div id="graph"></div>
  <div id="keys"><span class="key">Ctrl</span><span class="key__plus">+</span><span class="key">P</span></div>
  <div id="cursor"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 2.5v17.2l4.6-4.3 2.9 6.6 3-1.3-2.9-6.5h6.3z" fill="#fff" stroke="#14151f" stroke-width="1.6" stroke-linejoin="round"/></svg><div id="ripple"></div></div>
  <div id="outro">
    <div class="outro__line" id="outro-line"></div>
    <div class="outro__url" id="outro-url"><svg viewBox="0 0 16 16" width="30" height="30"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>github.com/enriqueleonq1/hedy</span></div>
    <div class="outro__meta" id="outro-meta">Open source · MIT</div>
  </div>
  <div id="caption"></div>
  <div id="fade"></div>
</div>
<script src="blob.js"></script>
<script src="scene.js"></script>
</body>
</html>
