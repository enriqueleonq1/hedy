[package]
name = "hedy-memory"
version = "1.4.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
hedy-core = { version = "1.4.0", path = "../hedy-core" }
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
