[package]
name = "hedy-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
hedy-core = { version = "0.1.0", path = "../hedy-core" }
rpassword = "7.5.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "hedy"
path = "src/main.rs"
