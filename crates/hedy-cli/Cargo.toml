[package]
name = "hedy-cli"
version = "1.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
ctrlc = "3.5.2"
hedy-core = { version = "1.0.1", path = "../hedy-core" }
rpassword = "7.5.5"
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "hedy"
path = "src/main.rs"
