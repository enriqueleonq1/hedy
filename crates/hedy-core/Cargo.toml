[package]
name = "hedy-core"
version = "1.6.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
trash = { version = "5.3.0", default-features = false, features = ["freedesktop"] }
jiff = "0.2.43"
regex = "1.13.1"
ureq = { version = "3.5.2", features = ["json"] }
chacha20poly1305 = "0.11.0"
crypto_box = { version = "0.9.1", features = ["seal"] }
ed25519-dalek = "3.0.0"
bip39 = { version = "3.0.0", features = ["spanish"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
hmac = "0.13.0"
zeroize = "1.9.2"
getrandom = "0.3"
spake2 = "0.4.0"
rand_chacha = "0.3.1"

tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
