[package]
name = "hedy-core"
version = "1.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
directories = "6.0.0"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
trash = { version = "5.3.0", default-features = false, features = ["freedesktop"] }
jiff = "0.2.43"
regex = "1.13.1"
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
